# hull-engine distro configuration.
#
# This distro exists only to run hulld. It deliberately does NOT enable systemd: hull's
# supervisor is simpler, starts faster, and avoids the delegated-cgroup single-writer dance.

[boot]
# Runs as root every time WSL starts this instance. This is how hulld comes up without
# anybody logging in.
command = /usr/local/bin/hull-boot

[automount]
# The engine's data lives on this distro's own ext4 VHDX. Windows drives are still mounted
# because bind mounts of Windows paths need them, but metadata there is ~60x slower, so
# nothing hull owns is ever placed under /mnt.
enabled = true
root = /mnt/
options = "metadata,umask=22,fmask=11"

[network]
generateHosts = true
generateResolvConf = true
hostname = hull-engine

[interop]
# The engine has no reason to launch Windows binaries, and leaving this on widens the
# attack surface from inside a container that escapes into the distro.
enabled = false
appendWindowsPath = false

[user]
default = root
